services:
  db:
    image: postgres:17-alpine
    container_name: kwanza-rates-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kwanza
      POSTGRES_PASSWORD: kwanza_dev
      POSTGRES_DB: kwanza_rates
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: